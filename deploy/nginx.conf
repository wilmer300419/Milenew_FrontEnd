# nginx del contenedor "web": sirve la app y reenvía /api al BackEnd.
# El navegador solo habla con este servidor; PostgreSQL no está expuesto.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;
    gzip_min_length 1024;

    # ---- cabeceras de seguridad (solo a nivel server: los location no usan add_header)
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.google.com/recaptcha/ https://www.gstatic.com/recaptcha/; frame-src https://www.google.com/recaptcha/ https://recaptcha.google.com/recaptcha/; img-src 'self' data: blob: https://*.tile.openstreetmap.org; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self' https://www.google.com/recaptcha/; worker-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    # Con HTTPS delante (Caddy, Traefik, balanceador…), activa también:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 1m;

    location /api/ {
        proxy_pass http://api:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 30s;
    }

    # Archivos con hash en el nombre: se pueden guardar un año
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # El service worker y el manifiesto siempre frescos
    location ~* ^/(sw\.js|manifest\.webmanifest|theme-init\.js)$ {
        expires -1;
        try_files $uri =404;
    }

    # Aplicación de una sola página: toda ruta desconocida carga index.html
    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
