name: Reporte de error
description: Algo no funciona como debería
labels: [bug]
body:
  - type: textarea
    id: que-pasa
    attributes:
      label: ¿Qué pasa?
      description: Describe el error y lo que esperabas que pasara.
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      placeholder: |
        1. Inicia sesión como pasajero@milenew.co
        2. Ve a Viajes
        3. …
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Área
      options: [FrontEnd, BackEnd, Base de datos, No sé]
    validations:
      required: true
  - type: textarea
    id: evidencia
    attributes:
      label: Capturas o mensajes de error
      description: Consola del navegador, terminal de Flask, etc.
